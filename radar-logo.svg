<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff453a"/>
      <stop offset="100%" stop-color="#ff9f0a"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Radar Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(10, 132, 255, 0.2)" stroke-width="4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(10, 132, 255, 0.3)" stroke-width="4"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="rgba(10, 132, 255, 0.45)" stroke-width="4"/>

  <!-- Crosshair axes -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="rgba(10, 132, 255, 0.25)" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="rgba(10, 132, 255, 0.25)" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Radar Scan Wedge -->
  <path d="M 256 256 L 390 122 A 190 190 0 0 0 256 66 Z" fill="url(#beamGrad)"/>

  <!-- Speed Warning Disc -->
  <circle cx="256" cy="256" r="54" fill="#ffffff" stroke="#d91c1c" stroke-width="12"/>
  <text x="256" y="268" font-family="-apple-system, system-ui, sans-serif" font-size="34" font-weight="900" fill="#000000" text-anchor="middle" dominant-baseline="central">90</text>

  <!-- Detected Hazard Blips -->
  <circle cx="340" cy="180" r="10" fill="#ff453a"/>
  <circle cx="340" cy="180" r="18" fill="none" stroke="#ff453a" stroke-width="3" opacity="0.6"/>

  <circle cx="170" cy="330" r="8" fill="#ff9f0a"/>
  <circle cx="370" cy="310" r="7" fill="#30d158"/>
</svg>
